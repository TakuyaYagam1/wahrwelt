name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: update-flake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-flake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Sync latest branch tip
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            experimental-features = nix-command flakes

      - name: Update managed flake inputs
        run: |
          update_flake_without_codex() {
            local flake_dir="$1"
            local -a input_names

            mapfile -t input_names < <(
              jq -r '.nodes.root.inputs | keys[] | select(. != "codex-desktop-linux")' \
                "$flake_dir/flake.lock"
            )

            if [ "${#input_names[@]}" -eq 0 ]; then
              echo "::error::No flake inputs found in $flake_dir/flake.lock"
              exit 1
            fi

            (
              cd "$flake_dir"
              nix flake update "${input_names[@]}"
            )
          }

          update_flake_without_codex .
          update_flake_without_codex Linux/NixOS

          for preset in minimal desktop developer personal; do
            update_flake_without_codex "Linux/NixOS/presets/${preset}"
          done

      - name: Verify end4-pC input ownership
        run: |
          for lock in \
            flake.lock \
            Linux/NixOS/flake.lock \
            Linux/NixOS/presets/desktop/flake.lock \
            Linux/NixOS/presets/developer/flake.lock \
            Linux/NixOS/presets/personal/flake.lock; do
            if ! jq -e '.nodes.root.inputs["end4-pc"]' "$lock" > /dev/null; then
              echo "::error::$lock must own the end4-pc input"
              exit 1
            fi
          done

          minimal_lock=Linux/NixOS/presets/minimal/flake.lock
          if jq -e '.nodes.root.inputs["end4-pc"]' "$minimal_lock" > /dev/null; then
            echo "::error::$minimal_lock must not own the end4-pc input"
            exit 1
          fi

      - name: Check public flake
        run: nix flake check --no-build

      - name: Build public shell module check
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.shells-module

      - name: Evaluate preset NixOS hosts
        run: |
          for preset in minimal desktop developer personal; do
            for attempt in 1 2 3; do
              if nix eval --raw --no-write-lock-file \
                "path:${GITHUB_WORKSPACE}?dir=Linux/NixOS/presets/${preset}#checks.x86_64-linux.preset-host.drvPath"; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to evaluate the ${preset} preset after ${attempt} attempts"
                exit 1
              fi

              delay_seconds=$((attempt * 15))
              echo "Preset evaluation failed; retrying ${preset} in ${delay_seconds}s"
              sleep "$delay_seconds"
            done
          done

      - name: Build public Wahrwelt package
        run: nix build .#wahrwelt --print-build-logs

      - name: Smoke-test public Wahrwelt and legacy binaries
        run: |
          ./result/bin/wahrwelt --help
          ./result/bin/mysetup --help
          nix build --no-link .#mysetup --print-build-logs

      - name: Build patched end4 Hypr config
        working-directory: Linux/NixOS
        run: nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.xdg.configFile."hypr/end4".source'

      - name: Build end4-pC Quickshell config
        working-directory: Linux/NixOS
        run: nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.xdg.configFile."quickshell/end4-pC".source'

      - name: Realize managed QuickShell transition artifact
        run: make -C Linux nix-shell-transition-build

      - name: Build patched Caelestia shell
        working-directory: Linux/NixOS
        run: nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.programs.caelestia.package'

      - name: Build NixOS Wahrwelt package
        working-directory: Linux/NixOS
        run: nix build .#wahrwelt --print-build-logs

      - name: Smoke-test NixOS Wahrwelt and legacy binaries
        working-directory: Linux/NixOS
        run: |
          ./result/bin/wahrwelt --help
          ./result/bin/mysetup --help
          nix build --no-link .#mysetup --print-build-logs

      - name: Check for changes
        id: check
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --exit-code \
            flake.lock \
            Linux/NixOS/flake.lock \
            Linux/NixOS/presets/*/flake.lock > /dev/null; then
            echo "modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "modified=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        id: cpr
        if: steps.check.outputs.modified == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          commit-message: "chore(nix): update flake locks"
          branch: "update-flake-locks"
          delete-branch: true
          add-paths: |
            flake.lock
            Linux/NixOS/flake.lock
            Linux/NixOS/presets/minimal/flake.lock
            Linux/NixOS/presets/desktop/flake.lock
            Linux/NixOS/presets/developer/flake.lock
            Linux/NixOS/presets/personal/flake.lock
          title: "chore(nix): update flake locks"
          body: |
            ## What

            Updates root, full NixOS, and preset-specific flake locks after scheduled input refresh.

            ## Why

            Keeps pinned flake inputs current while preserving review through a pull request.

            ## Testing

            - `nix flake check --no-build`
            - `nix build --no-link --print-build-logs .#checks.x86_64-linux.shells-module`
            - preset `nix eval --raw --no-write-lock-file …#checks.x86_64-linux.preset-host.drvPath`
            - `nix build .#wahrwelt --print-build-logs`
            - `nix build --no-link .#mysetup --print-build-logs`
            - `./result/bin/wahrwelt --help`
            - `./result/bin/mysetup --help`
            - end4-pC input ownership: present in root/full/desktop/developer/personal locks and absent from minimal
            - `nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.xdg.configFile."hypr/end4".source'`
            - `nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.xdg.configFile."quickshell/end4-pC".source'`
            - `nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.programs.caelestia.package'`
            - `nix build .#wahrwelt --print-build-logs`
            - `nix build --no-link .#mysetup --print-build-logs`
            - `./result/bin/wahrwelt --help`
            - `./result/bin/mysetup --help`

      - name: Validate and merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: bash .github/scripts/merge-automation-pr.sh "$PR_NUMBER"
