name: Update OmniRouter

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific OmniRouter version without leading v (optional)"
        required: false
        type: string
  schedule:
    - cron: "0 0 */3 * *"

jobs:
  update-omnirouter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLAKE: ./Linux/NixOS
      OMNIROUTER_NIX: Linux/NixOS/pkgs/omnirouter.nix
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Read current version
        id: current
        run: |
          current="$(grep -oP 'version = "\K[^"]+' "$OMNIROUTER_NIX" | head -1)"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Resolve latest release
        id: release
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                https://api.github.com/repos/diegosouzapw/OmniRoute/releases/latest \
                | jq -r '.tag_name | sub("^v"; "")'
            )"
          fi
          version="${version#v}"

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Failed to resolve latest OmniRouter release"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          current="${{ steps.current.outputs.version }}"
          target="${{ steps.release.outputs.version }}"
          manual="${{ github.event.inputs.version }}"

          if [ "$current" = "$target" ]; then
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "OmniRouter is already on v$current"
            exit 0
          fi

          if [ -n "$manual" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "Manual update requested: v$current -> v$target"
            exit 0
          fi

          newest="$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)"
          if [ "$newest" != "$target" ]; then
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "Latest GitHub release v$target is not newer than packaged v$current; skipping downgrade."
            exit 0
          fi

          echo "should_update=true" >> "$GITHUB_OUTPUT"
          echo "Updating OmniRouter: v$current -> v$target"

      - name: Compute source hash
        id: src
        if: steps.compare.outputs.should_update == 'true'
        run: |
          url="https://github.com/diegosouzapw/OmniRoute/archive/refs/tags/v${{ steps.release.outputs.version }}.tar.gz"
          hash="$(nix-prefetch-url --unpack "$url")"
          sri="$(nix hash convert --hash-algo sha256 --to sri "$hash")"
          echo "hash=$sri" >> "$GITHUB_OUTPUT"

      - name: Patch version and source hash
        if: steps.compare.outputs.should_update == 'true'
        run: |
          sed -i 's/version = "[^"]*"/version = "${{ steps.release.outputs.version }}"/' "$OMNIROUTER_NIX"
          sed -i 's/rev = "v[^"]*"/rev = "v${{ steps.release.outputs.version }}"/' "$OMNIROUTER_NIX"
          sed -i 's|hash = "sha256-[^"]*"|hash = "${{ steps.src.outputs.hash }}"|' "$OMNIROUTER_NIX"
          sed -i 's|npmDepsHash = "sha256-[^"]*"|npmDepsHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="|' "$OMNIROUTER_NIX"

      - name: Compute npmDepsHash
        id: npm
        if: steps.compare.outputs.should_update == 'true'
        run: |
          set +e
          output="$(nix build --no-link --no-write-lock-file "$FLAKE#omnirouter" 2>&1)"
          set -e

          got="$(printf '%s\n' "$output" | sed -nE 's/.*got:[[:space:]]*(sha256-[A-Za-z0-9+\\/=]+).*/\1/p' | tail -1)"

          if [ -z "$got" ]; then
            printf '%s\n' "$output"
            echo "::error::Failed to extract npmDepsHash from build output"
            exit 1
          fi

          echo "hash=$got" >> "$GITHUB_OUTPUT"
          sed -i 's|npmDepsHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="|npmDepsHash = "'"$got"'"|' "$OMNIROUTER_NIX"

      - name: Verify build
        if: steps.compare.outputs.should_update == 'true'
        run: |
          nix build --no-link --print-build-logs --no-write-lock-file "$FLAKE#omnirouter"

      - name: Create pull request
        id: cpr
        if: steps.compare.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          commit-message: "chore(nix): update omnirouter"
          branch: "update-omnirouter"
          delete-branch: true
          add-paths: |
            Linux/NixOS/pkgs/omnirouter.nix
          title: "chore(nix): update omnirouter to v${{ steps.release.outputs.version }}"
          body: |
            ## What

            Updates local `omnirouter` package to `v${{ steps.release.outputs.version }}`.

            Updated hashes:
            - source: `${{ steps.src.outputs.hash }}`
            - npmDepsHash: `${{ steps.npm.outputs.hash }}`

            ## Why

            Keeps the packaged OmniRouter release current.

            ## Testing

            - `nix build --no-link --print-build-logs --no-write-lock-file "$FLAKE#omnirouter"`

      - name: Validate and merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: bash .github/scripts/merge-automation-pr.sh "$PR_NUMBER"
