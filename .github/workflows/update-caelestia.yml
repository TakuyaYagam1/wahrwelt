name: Update Caelestia

on:
  workflow_dispatch:
    inputs:
      shellVersion:
        description: "Specific caelestia-shell version without leading v (optional)"
        required: false
        type: string
      cliVersion:
        description: "Specific caelestia-cli version without leading v (optional)"
        required: false
        type: string
  schedule:
    - cron: "0 0 */3 * *"

jobs:
  update-caelestia:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLAKE: ./Linux/NixOS
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve current and latest versions
        id: resolve
        run: |
          resolve_one() {
            local repo="$1" manual="$2" anchor="$3"
            local current target

            current="$(grep -oP "url = \"github:${repo}(?=[\"/])\K[^\"]*" flake.nix | sed 's#^/##')"

            if [ -n "$manual" ]; then
              target="$manual"
            else
              target="$(
                curl -fsSL \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  "https://api.github.com/repos/${repo}/releases/latest" \
                  | jq -r '.tag_name'
              )"
            fi
            target="${target#v}"
            [ -n "$current" ] && current="${current#v}"

            if [ -z "$target" ] || [ "$target" = "null" ]; then
              echo "::error::Failed to resolve latest release for $repo"
              exit 1
            fi

            local should=false
            if [ -z "$current" ]; then
              should=true
              echo "$anchor: currently unpinned -> v$target"
            elif [ "$current" = "$target" ]; then
              echo "$anchor: already on v$current"
            elif [ -n "$manual" ]; then
              should=true
              echo "$anchor: manual update v$current -> v$target"
            else
              local newest
              newest="$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)"
              if [ "$newest" = "$target" ]; then
                should=true
                echo "$anchor: v$current -> v$target"
              else
                echo "$anchor: latest release v$target is not newer than pinned v$current; skipping downgrade."
              fi
            fi

            {
              echo "${anchor}_current=$current"
              echo "${anchor}_target=$target"
              echo "${anchor}_should=$should"
            } >> "$GITHUB_OUTPUT"
          }

          resolve_one "caelestia-dots/shell" "${{ github.event.inputs.shellVersion }}" "shell"
          resolve_one "caelestia-dots/cli" "${{ github.event.inputs.cliVersion }}" "cli"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.resolve.outputs.shell_should }}" = "true" ] || [ "${{ steps.resolve.outputs.cli_should }}" = "true" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch flake inputs
        if: steps.compare.outputs.should_update == 'true'
        run: |
          for f in \
            flake.nix \
            Linux/NixOS/flake.nix \
            Linux/NixOS/lib/preset-inputs.nix \
            Linux/NixOS/presets/desktop/flake.nix \
            Linux/NixOS/presets/developer/flake.nix \
            Linux/NixOS/presets/personal/flake.nix; do
            if [ "${{ steps.resolve.outputs.shell_should }}" = "true" ]; then
              sed -i -E 's|url = "github:caelestia-dots/shell(/[^"]*)?"|url = "github:caelestia-dots/shell/v${{ steps.resolve.outputs.shell_target }}"|' "$f"
            fi
            if [ "${{ steps.resolve.outputs.cli_should }}" = "true" ]; then
              sed -i -E 's|url = "github:caelestia-dots/cli(/[^"]*)?"|url = "github:caelestia-dots/cli/v${{ steps.resolve.outputs.cli_target }}"|' "$f"
            fi
          done

      - name: Relock flakes
        if: steps.compare.outputs.should_update == 'true'
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake lock
          nix --extra-experimental-features 'nix-command flakes' flake lock "$FLAKE"
          for preset in desktop developer personal; do
            nix --extra-experimental-features 'nix-command flakes' flake lock \
              "path:${GITHUB_WORKSPACE}?dir=Linux/NixOS/presets/${preset}"
          done

      - name: Evaluate Caelestia integration
        if: steps.compare.outputs.should_update == 'true'
        run: |
          nix eval --raw --no-write-lock-file '.#checks.x86_64-linux.shells-module.drvPath'
          nix eval --raw --no-write-lock-file \
            "$FLAKE#nixosConfigurations.NixOS.config.home-manager.users.user.programs.caelestia.package.drvPath"

      - name: Build updated Caelestia packages
        if: steps.compare.outputs.should_update == 'true'
        run: |
          nix build --no-link --print-build-logs --no-write-lock-file \
            "$FLAKE#nixosConfigurations.NixOS.config.home-manager.users.user.programs.caelestia.package" \
            "$FLAKE#nixosConfigurations.NixOS.config.home-manager.users.user.programs.caelestia.cli.package"

      - name: Create pull request
        id: cpr
        if: steps.compare.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          commit-message: "chore(nix): update caelestia"
          branch: "update-caelestia"
          delete-branch: true
          add-paths: |
            flake.nix
            flake.lock
            Linux/NixOS/flake.nix
            Linux/NixOS/flake.lock
            Linux/NixOS/lib/preset-inputs.nix
            Linux/NixOS/presets/desktop/flake.nix
            Linux/NixOS/presets/desktop/flake.lock
            Linux/NixOS/presets/developer/flake.nix
            Linux/NixOS/presets/developer/flake.lock
            Linux/NixOS/presets/personal/flake.nix
            Linux/NixOS/presets/personal/flake.lock
          title: "chore(nix): update caelestia-shell/cli"
          body: |
            ## What

            Pins `caelestia-shell` to `v${{ steps.resolve.outputs.shell_target }}` and `caelestia-cli` to `v${{ steps.resolve.outputs.cli_target }}` (only the ones that actually changed), in the root, full NixOS, and desktop-or-higher preset flakes.

            ## Why

            Keeps the deployed Caelestia shell current without every routine `nix flake update` yanking in an unstable `main` commit and forcing a from-scratch local rebuild.

            ## Testing

            - Evaluated the public shell module and the NixOS Caelestia package derivation.
            - Built only the Caelestia shell and CLI packages.

      - name: Validate and merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: bash .github/scripts/merge-automation-pr.sh "$PR_NUMBER"
