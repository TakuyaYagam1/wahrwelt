name: Update Noctalia

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific noctalia version without leading v (optional)"
        required: false
        type: string
  schedule:
    - cron: "0 0 */3 * *"

jobs:
  update-noctalia:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLAKE: ./Linux/NixOS
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Read current version
        id: current
        run: |
          current="$(grep -oP 'url = "github:noctalia-dev/noctalia(?=["/])\K[^"]*' flake.nix | sed 's#^/##;s/^v//')"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Resolve latest release
        id: release
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                https://api.github.com/repos/noctalia-dev/noctalia/releases/latest \
                | jq -r '.tag_name'
            )"
          fi
          version="${version#v}"

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Failed to resolve latest Noctalia release"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          current="${{ steps.current.outputs.version }}"
          target="${{ steps.release.outputs.version }}"
          manual="${{ github.event.inputs.version }}"

          if [ -z "$current" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "Noctalia is currently unpinned -> v$target"
            exit 0
          fi

          if [ "$current" = "$target" ]; then
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "Noctalia is already on v$current"
            exit 0
          fi

          if [ -n "$manual" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "Manual update requested: v$current -> v$target"
            exit 0
          fi

          newest="$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)"
          if [ "$newest" != "$target" ]; then
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "Latest release v$target is not newer than pinned v$current; skipping downgrade."
            exit 0
          fi

          echo "should_update=true" >> "$GITHUB_OUTPUT"
          echo "Updating Noctalia: v$current -> v$target"

      - name: Patch flake inputs
        if: steps.compare.outputs.should_update == 'true'
        run: |
          for f in \
            flake.nix \
            Linux/NixOS/flake.nix \
            Linux/NixOS/lib/preset-inputs.nix \
            Linux/NixOS/presets/desktop/flake.nix \
            Linux/NixOS/presets/developer/flake.nix \
            Linux/NixOS/presets/personal/flake.nix; do
            sed -i -E 's|url = "github:noctalia-dev/noctalia(/[^"]*)?"|url = "github:noctalia-dev/noctalia/v${{ steps.release.outputs.version }}"|' "$f"
          done

      - name: Relock flakes
        if: steps.compare.outputs.should_update == 'true'
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake lock
          nix --extra-experimental-features 'nix-command flakes' flake lock "$FLAKE"
          for preset in desktop developer personal; do
            nix --extra-experimental-features 'nix-command flakes' flake lock \
              "path:${GITHUB_WORKSPACE}?dir=Linux/NixOS/presets/${preset}"
          done

      - name: Evaluate Noctalia integration
        if: steps.compare.outputs.should_update == 'true'
        run: |
          nix eval --raw --no-write-lock-file '.#checks.x86_64-linux.shells-module.drvPath'
          nix eval --raw --no-write-lock-file \
            "$FLAKE#nixosConfigurations.NixOS.config.home-manager.users.user.programs.noctalia.package.drvPath"

      - name: Build updated Noctalia package
        if: steps.compare.outputs.should_update == 'true'
        run: |
          nix build --no-link --print-build-logs --no-write-lock-file \
            "$FLAKE#nixosConfigurations.NixOS.config.home-manager.users.user.programs.noctalia.package"

      - name: Create pull request
        id: cpr
        if: steps.compare.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          commit-message: "chore(nix): update noctalia"
          branch: "update-noctalia"
          delete-branch: true
          add-paths: |
            flake.nix
            flake.lock
            Linux/NixOS/flake.nix
            Linux/NixOS/flake.lock
            Linux/NixOS/lib/preset-inputs.nix
            Linux/NixOS/presets/desktop/flake.nix
            Linux/NixOS/presets/desktop/flake.lock
            Linux/NixOS/presets/developer/flake.nix
            Linux/NixOS/presets/developer/flake.lock
            Linux/NixOS/presets/personal/flake.nix
            Linux/NixOS/presets/personal/flake.lock
          title: "chore(nix): update noctalia to v${{ steps.release.outputs.version }}"
          body: |
            ## What

            Pins `noctalia` to `v${{ steps.release.outputs.version }}`, in the root, full NixOS, and desktop-or-higher preset flakes.

            ## Why

            Keeps the deployed Noctalia shell current without every routine `nix flake update` yanking in an unstable `main` commit and forcing a from-scratch local rebuild.

            ## Testing

            - Evaluated the public shell module and the NixOS Noctalia package derivation.
            - Built only the updated Noctalia package.

      - name: Validate and merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: bash .github/scripts/merge-automation-pr.sh "$PR_NUMBER"
